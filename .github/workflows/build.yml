name: Build VoidLink

on:
  push:
    branches: [ Integration, main, master ]
  pull_request:
    branches: [ Integration, main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VoidLink (iOS)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VoidLink.xcodeproj \
            -scheme VoidLink

      - name: Build (Debug, generic iOS device)
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build (Release, generic iOS device)
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive (Release, unsigned)
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/VoidLink.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/IPA/Payload
          cp -R build/VoidLink.xcarchive/Products/Applications/VoidLink.app build/IPA/Payload/
          (cd build/IPA && zip -qry ../VoidLink-unsigned.ipa Payload)
          ls -lh build/VoidLink-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned
          path: build/VoidLink-unsigned.ipa
          retention-days: 14
