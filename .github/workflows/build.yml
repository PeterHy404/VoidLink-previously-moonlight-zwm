name: Build VoidLink

on:
  push:
    branches: [ Integration, main, master ]
  pull_request:
    branches: [ Integration, main, master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Debug / Release)'
        required: true
        type: choice
        default: Release
        options:
          - Debug
          - Release
      package_ipa:
        description: 'Archive and package unsigned IPA'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build VoidLink (iOS)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CONFIG: ${{ github.event.inputs.configuration || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VoidLink.xcodeproj \
            -scheme VoidLink

      - name: Build (Debug, generic iOS device)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.configuration == 'Debug'
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build (Release, generic iOS device)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.configuration == 'Release'
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive (unsigned)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.package_ipa == 'true'
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/VoidLink.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package unsigned IPA
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.package_ipa == 'true'
        run: |
          mkdir -p build/IPA/Payload
          cp -R build/VoidLink.xcarchive/Products/Applications/VoidLink.app build/IPA/Payload/
          (cd build/IPA && zip -qry ../VoidLink-unsigned.ipa Payload)
          ls -lh build/VoidLink-unsigned.ipa

      - name: Upload IPA artifact
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.package_ipa == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned
          path: build/VoidLink-unsigned.ipa
          retention-days: 14
